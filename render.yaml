services:
  - type: web
    name: braintumor-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 300 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
